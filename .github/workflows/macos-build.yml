name: Trusted macOS build

on:
  workflow_call:
    outputs:
      aarch64-artifact-id:
        value: ${{ jobs.build-aarch64.outputs.artifact-id }}
      x86-artifact-id:
        value: ${{ jobs.build-x86.outputs.artifact-id }}
      receipt-artifact-id:
        value: ${{ jobs.attest.outputs.receipt-artifact-id }}
      builder-sha:
        value: ${{ jobs.authorize.outputs.builder-sha }}
      source-sha:
        value: ${{ jobs.authorize.outputs.source-sha }}

permissions: {}

env:
  RUST_TOOLCHAIN: "1.100.0"
  DO_NOT_TRACK: "1"

jobs:
  authorize:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      builder-sha: ${{ steps.identity.outputs.builder-sha }}
      source-sha: ${{ steps.source.outputs.source-sha }}
    steps:
      - name: Validate immutable builder identity
        id: identity
        env:
          WORKFLOW_JOB: ${{ toJSON(job) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          job = json.loads(os.environ["WORKFLOW_JOB"])
          sha = job.get("workflow_sha") if isinstance(job, dict) else None
          if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Missing immutable builder SHA")
          if job.get("workflow_repository") != "ClickHouse/clickhousectl":
              raise SystemExit("Unexpected builder repository")
          expected = f"ClickHouse/clickhousectl/.github/workflows/macos-build.yml@{sha}"
          if job.get("workflow_ref") != expected:
              raise SystemExit("Builder must be called by its full commit SHA")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"builder-sha={sha}\n")
          PY

      - name: Checkout trusted helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ClickHouse/clickhousectl
          ref: ${{ steps.identity.outputs.builder-sha }}
          path: builder
          persist-credentials: false

      - name: Authorize release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 builder/scripts/check-release-source.py --sha "$GITHUB_SHA" --ref "$GITHUB_REF"
          echo "source-sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  build-aarch64:
    needs: authorize
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Reject OIDC credentials
        run: |
          if [[ ${ACTIONS_ID_TOKEN_REQUEST_URL+x} ]]; then
            echo '::error::OIDC must not be available in a build job'
            exit 1
          fi
      - name: Checkout authorized source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.source-sha }}
          persist-credentials: false
      - name: Verify source revision
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source-sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin
      - name: Build and stage binary
        run: |
          set -euo pipefail
          cargo +"$RUST_TOOLCHAIN" build -p clickhousectl --release --locked --target aarch64-apple-darwin
          mkdir -p "$RUNNER_TEMP/unsigned"
          cp target/aarch64-apple-darwin/release/clickhousectl "$RUNNER_TEMP/unsigned/clickhousectl-aarch64-apple-darwin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Upload raw binary
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/unsigned/clickhousectl-aarch64-apple-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          archive: false
          overwrite: false
          retention-days: 7
          if-no-files-found: error

  build-x86:
    needs: authorize
    timeout-minutes: 45
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Reject OIDC credentials
        run: |
          if [[ ${ACTIONS_ID_TOKEN_REQUEST_URL+x} ]]; then
            echo '::error::OIDC must not be available in a build job'
            exit 1
          fi
      - name: Checkout authorized source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.source-sha }}
          persist-credentials: false
      - name: Verify source revision
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source-sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-apple-darwin
      - name: Build and stage binary
        run: |
          set -euo pipefail
          cargo +"$RUST_TOOLCHAIN" build -p clickhousectl --release --locked --target x86_64-apple-darwin
          mkdir -p "$RUNNER_TEMP/unsigned"
          cp target/x86_64-apple-darwin/release/clickhousectl "$RUNNER_TEMP/unsigned/clickhousectl-x86_64-apple-darwin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Upload raw binary
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/unsigned/clickhousectl-x86_64-apple-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          archive: false
          overwrite: false
          retention-days: 7
          if-no-files-found: error

  attest:
    needs: [authorize, build-aarch64, build-x86]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      receipt-artifact-id: ${{ steps.upload-receipt.outputs.artifact-id }}
    steps:
      - name: Checkout trusted helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ClickHouse/clickhousectl
          ref: ${{ needs.authorize.outputs.builder-sha }}
          path: builder
          persist-credentials: false
      - name: Download exact raw binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-aarch64.outputs.artifact-id }},${{ needs.build-x86.outputs.artifact-id }}
          path: ${{ runner.temp }}/unsigned
          merge-multiple: true
          digest-mismatch: error
      - name: Create build receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source-sha }}
          BUILDER_SHA: ${{ needs.authorize.outputs.builder-sha }}
          AARCH64_ID: ${{ needs.build-aarch64.outputs.artifact-id }}
          AARCH64_DIGEST: ${{ needs.build-aarch64.outputs.artifact-digest }}
          X86_ID: ${{ needs.build-x86.outputs.artifact-id }}
          X86_DIGEST: ${{ needs.build-x86.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python3 builder/scripts/release_artifacts.py receipt \
            --directory "$RUNNER_TEMP/unsigned" --source-sha "$SOURCE_SHA" --ref "$GITHUB_REF" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --builder-sha "$BUILDER_SHA" \
            --aarch64-artifact-id "$AARCH64_ID" --aarch64-artifact-digest "$AARCH64_DIGEST" \
            --x86-artifact-id "$X86_ID" --x86-artifact-digest "$X86_DIGEST"
      - name: Attest binaries and receipt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/unsigned/*
      - name: Upload raw receipt
        id: upload-receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/unsigned/macos-build-receipt-${{ github.run_id }}-${{ github.run_attempt }}.json
          archive: false
          overwrite: false
          retention-days: 7
          if-no-files-found: error
