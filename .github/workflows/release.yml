name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"

jobs:
  # Every other job needs this one, directly or through `build`. On a tag it
  # fails unless the tag is vX.Y.Z and every manifest and Cargo.lock carries
  # X.Y.Z, so a missed bump stops before anything is built or published.
  # Without a tag (workflow_dispatch from a branch) the manifests need only
  # agree. The same script runs on pull requests (test-cloud-api.yml).
  preflight:
    name: Check release versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag and manifest versions
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            python3 scripts/check-release-versions.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/check-release-versions.py
          fi

  macos-build:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: preflight
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
      attestations: write
    uses: ClickHouse/clickhousectl/.github/workflows/macos-build.yml@45f968dc7b3630002f25021e8c3dcd6c9239853b

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-10-16
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build
        run: |
          cross build --release --locked --target ${{ matrix.target }}

      - name: Verify static linking
        run: |
          binary="target/${{ matrix.target }}/release/clickhousectl"
          echo "--- file output ---"
          file "$binary"
          file "$binary" | grep -qE "statically linked|static-pie linked"
          echo "--- ldd output ---"
          ldd_output=$(ldd "$binary" 2>&1 || true)
          echo "$ldd_output"
          echo "$ldd_output" | grep -qE "not a dynamic executable|statically linked"
          echo "Static linking verified."

      # The internal `debug-log` feature must never ship.
      - name: Verify debug-log is compiled out
        run: |
          binary="target/${{ matrix.target }}/release/clickhousectl"
          if grep -q CLICKHOUSECTL_DEBUG_LOG "$binary"; then
            echo "Release binary contains the debug-log feature" >&2
            exit 1
          fi

      - name: Compute version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          DIR="clickhousectl-${TARGET}-v${VERSION}"
          mkdir "$DIR"
          cp "target/${TARGET}/release/clickhousectl" "$DIR/"
          # install.sh, npm install.js and `update` take the binary by name,
          # so the licence beside it changes nothing they extract.
          cp LICENSE "$DIR/"
          tar -czf "${DIR}.tar.gz" "$DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clickhousectl-${{ matrix.target }}-v${{ steps.version.outputs.version }}
          path: clickhousectl-${{ matrix.target }}-v${{ steps.version.outputs.version }}.tar.gz

  smoke-test:
    name: Smoke test (${{ matrix.distro }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:bullseye
          - debian:bookworm
          - centos:7
          - amazonlinux:2
          - alpine:3.18
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - name: Compute version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clickhousectl-${{ env.TARGET }}-v${{ steps.version.outputs.version }}

      - name: Extract archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DIR="clickhousectl-${TARGET}-v${VERSION}"
          tar -xzf "${DIR}.tar.gz"
          chmod +x "${DIR}/clickhousectl"
          echo "BIN_PATH=${PWD}/${DIR}/clickhousectl" >> "$GITHUB_ENV"

      - name: Run smoke test in ${{ matrix.distro }}
        run: |
          docker run --rm \
            -e DO_NOT_TRACK=1 \
            -v "${BIN_PATH}:/usr/local/bin/clickhousectl:ro" \
            ${{ matrix.distro }} \
            sh -c 'clickhousectl --version && clickhousectl --help'

  signed-release:
    name: Verify and approve publishable release bytes
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [macos-build, build, smoke-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Protect this environment to reviewed release tags, with Product Security
    # approval and no admin bypass for the first real release.
    environment: signed-release-publish
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          pattern: clickhousectl-*-unknown-linux-musl-${{ github.ref_name }}
          merge-multiple: true
          digest-mismatch: error
      - name: Validate the manually approved signer handoff
        env:
          MACOS_RELEASE_BUNDLE_URL: ${{ secrets.MACOS_RELEASE_BUNDLE_URL }}
          MACOS_RELEASE_BUNDLE_SHA256: ${{ vars.MACOS_RELEASE_AUDITED_BUNDLE_SHA256 }}
          MACOS_SIGNER_SHA: ${{ vars.MACOS_RELEASE_SIGNER_SHA }}
          MACOS_LEAF_SHA256: ${{ vars.MACOS_RELEASE_LEAF_SHA256 }}
          PYPI_SCOPE: ${{ vars.MACOS_RELEASE_PYPI_SCOPE }}
          RECEIPT_ATTEMPT: ${{ needs.macos-build.outputs.receipt-run-attempt }}
        run: |
          set -euo pipefail
          if [[ "$PYPI_SCOPE" != linux-only ]]; then
            echo "::error::The first-release PyPI scope must be explicitly approved"
            exit 1
          fi
          python3 scripts/fetch-signed-release.py notarized
          manifest_sha256=$(sha256sum notarized/manifest.json | cut -d ' ' -f 1)
          python3 scripts/check-release-assets.py verify-macos --directory notarized \
            --manifest-sha256 "$manifest_sha256" --source-sha "$GITHUB_SHA" --ref "$GITHUB_REF" \
            --run-id "$GITHUB_RUN_ID" --receipt-run-attempt "$RECEIPT_ATTEMPT" \
            --leaf-sha256 "$MACOS_LEAF_SHA256" --signer-sha "$MACOS_SIGNER_SHA"
      - name: Package exactly the verified macOS bytes
        run: |
          set -euo pipefail
          for pair in arm64:aarch64 x86_64:x86_64; do
            binary="notarized/${pair%:*}"
            if grep -aq CLICKHOUSECTL_DEBUG_LOG "$binary"; then
              echo "::error::Release binary contains the debug-log feature"
              exit 1
            fi
            dir="clickhousectl-${pair#*:}-apple-darwin-${GITHUB_REF_NAME}"
            mkdir -p "package/$dir"
            install -m 0755 "$binary" "package/$dir/clickhousectl"
            install -m 0644 LICENSE "package/$dir/LICENSE"
            tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
              -C package -czf "assets/$dir.tar.gz" "$dir"
          done
          python3 scripts/check-release-assets.py verify-archives --directory assets \
            --ref "$GITHUB_REF" --manifest notarized/manifest.json
          (cd assets && sha256sum clickhousectl-*.tar.gz > SHA256SUMS)
          cp notarized/{manifest.json,notarization.json,arm64-receipt.json,x86_64-receipt.json} assets/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: authorized-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: assets/
          if-no-files-found: error

  # Uploading the archives before Create Release means the newest release is
  # never visible without its archives. `publish-latest` points
  # `clickhousectl update` and install.sh at it afterwards.
  #
  # S3 and the GitHub/npm publishers consume the same gate artifact.
  upload-builds:
    name: Upload to builds.clickhouse.com
    needs: signed-release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag'
    # `id-token: write` lets the job assume the external-s3-upload role
    # (ClickHouse/clickhouse-private tests/ci/terraform/external_s3_upload.tf)
    # through GitHub OIDC. It may write only under clickhouse-builds/clickhousectl/.
    # It also signs the provenance attestation, with `attestations: write`.
    permissions:
      id-token: write
      contents: read
      attestations: write
    env:
      S3_BUCKET: clickhouse-builds
      S3_PREFIX: clickhousectl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the exact authorized release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.signed-release.outputs.artifact-id }}
          path: artifacts
          digest-mismatch: error
          merge-multiple: true

      - name: Verify the approved checksums
        working-directory: artifacts
        run: sha256sum --check --strict SHA256SUMS

      # Verifiable with `gh attestation verify <archive> -R ClickHouse/clickhousectl`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: artifacts/SHA256SUMS

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::542516086801:role/external-s3-upload
          aws-region: us-east-1

      - name: Upload and check the approved S3 bytes
        working-directory: artifacts
        run: bash "$GITHUB_WORKSPACE/scripts/upload-release-assets.sh"

  # One `gh release create` uploads the archives and SHA256SUMS together, so
  # the release (and the `releases/latest` fallback that names it) is never
  # visible without the sums that `update` and install.sh require.
  release:
    name: Create Release
    needs: [signed-release, upload-builds]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.signed-release.outputs.artifact-id }}
          digest-mismatch: error
          path: release

      - name: Check release assets
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes release/*

  # `clickhousectl update` and install.sh read the latest version from
  # builds.clickhouse.com/clickhousectl/latest.txt rather than the
  # rate-limited GitHub API. It moves only forwards, so re-running an older
  # tag cannot downgrade users, and the run fails unless builds.clickhouse.com
  # serves the expected version afterwards.
  publish-latest:
    name: Publish latest.txt
    needs: [upload-builds, release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      id-token: write
      contents: read
    env:
      S3_BUCKET: clickhouse-builds
      KEY: clickhousectl/latest.txt
      URL: https://builds.clickhouse.com/clickhousectl/latest.txt
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::latest.txt takes only vX.Y.Z tags, got ${TAG}"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::542516086801:role/external-s3-upload
          aws-region: us-east-1

      - name: Upload latest.txt
        run: |
          if err=$(aws s3 cp "s3://${S3_BUCKET}/${KEY}" current.txt 2>&1 >/dev/null); then
            current=$(tr -d '[:space:]' < current.txt)
          elif echo "$err" | grep -qE "Not Found|NoSuchKey|404"; then
            current=""
          else
            echo "::error::reading s3://${S3_BUCKET}/${KEY} failed: ${err}"
            exit 1
          fi
          echo "Current latest.txt: ${current:-<none>}"
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "${current#v}" "${TAG#v}" | sort -V | tail -n1)" != "${TAG#v}" ]; then
            echo "::notice::latest.txt already points at newer ${current}; leaving it"
            echo "EXPECTED=${current}" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s\n' "$TAG" > latest.txt
          aws s3 cp latest.txt "s3://${S3_BUCKET}/${KEY}" \
            --content-type text/plain --cache-control no-cache
          echo "EXPECTED=${TAG}" >> "$GITHUB_ENV"

      # Clients add a unique query string because builds.clickhouse.com caches
      # every path for days; verify through the same route they use.
      - name: Verify builds.clickhouse.com serves it
        run: |
          for attempt in 1 2 3 4 5; do
            served=$(curl -fsSL "${URL}?t=$(date +%s)-${attempt}" | tr -d '[:space:]' || true)
            if [ "$served" = "$EXPECTED" ]; then
              echo "builds.clickhouse.com serves ${served}"
              exit 0
            fi
            echo "Attempt ${attempt}: served '${served}', expected '${EXPECTED}'"
            sleep 10
          done
          echo "::error::${URL} does not serve ${EXPECTED}"
          exit 1

  publish-crates:
    name: Publish to crates.io
    needs: [preflight, release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag'
    environment: release-publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-10-16

      - name: Publish clickhouse-cloud-api (skip if version already on crates.io)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION=$(cargo pkgid -p clickhouse-cloud-api | sed 's/.*[#@]//')
          if curl -fsSI "https://crates.io/api/v1/crates/clickhouse-cloud-api/${VERSION}" >/dev/null 2>&1; then
            echo "clickhouse-cloud-api@${VERSION} already published; skipping."
            echo "SKIP_API_PROPAGATION=1" >> "$GITHUB_ENV"
          else
            cargo publish -p clickhouse-cloud-api
          fi

      - name: Wait for crates.io index propagation
        if: env.SKIP_API_PROPAGATION != '1'
        run: sleep 30

      - name: Publish clickhousectl
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p clickhousectl

  publish-npm:
    name: Publish to npm
    # preflight guarantees npm/package.json already carries the tag version.
    needs: [preflight, release, signed-release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag'
    # `id-token: write` is required for npm OIDC trusted publishing. Do NOT
    # set NODE_AUTH_TOKEN below — per npm docs, even an empty value forces
    # token-based auth and short-circuits the OIDC flow.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24+ ships npm >= 11.5.1, which is required for npm Trusted
          # Publishing OIDC. Older npm versions cause the OIDC handshake to
          # silently fail and the registry returns a misleading 404 on publish.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # install.js verifies the downloaded archive against this embedded copy
      # and refuses to install without it (#1307).
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.signed-release.outputs.artifact-id }}
          digest-mismatch: error
          path: release-assets

      - name: Embed SHA256SUMS
        run: |
          cp release-assets/SHA256SUMS npm/SHA256SUMS
          for target in aarch64-apple-darwin aarch64-unknown-linux-musl x86_64-apple-darwin x86_64-unknown-linux-musl; do
            grep -q " clickhousectl-${target}-${GITHUB_REF_NAME}\.tar\.gz$" npm/SHA256SUMS \
              || { echo "::error::SHA256SUMS has no ${target} archive"; exit 1; }
          done
          (cd npm && npm pack --dry-run --json) | grep -q '"path": "SHA256SUMS"' \
            || { echo "::error::SHA256SUMS is not in the npm package"; exit 1; }

      - name: Publish
        working-directory: npm
        run: npm publish --provenance --access public

  build-wheels:
    # macOS wheels currently build a separate channel-pip executable that has
    # not passed the signing gate. Do not ship it unsigned.
    name: Build wheel (${{ matrix.target }})
    # preflight guarantees crates/clickhousectl/Cargo.toml, which sets the
    # wheel version, already carries the tag version.
    needs: [preflight, release]
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: '2_28'
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: '2_28'
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            manylinux: musllinux_1_2
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            manylinux: musllinux_1_2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: pypi
          args: --release --locked --out dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: pypi/dist/*.whl

  publish-pypi:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag'
    # PyPI trusted publishing recommends binding the publish job to an
    # environment so the OIDC subject includes `environment:pypi`, which is
    # pinned on PyPI's trusted-publisher config for the project.
    environment: pypi
    # `id-token: write` is required for PyPI OIDC trusted publishing. The
    # publisher action picks up OIDC automatically when no token input is
    # provided.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: wheels
          pattern: wheel-*
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheels
