name: Temporary provenance runtime probe

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      builder-sha: ${{ steps.identity.outputs.builder-sha }}
    steps:
      - name: Check actual immutable job identity without OIDC
        id: identity
        env:
          WORKFLOW_JOB: ${{ toJSON(job) }}
        run: |
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL+x}"
          python3 - <<'PY'
          import json, os, re
          job = json.loads(os.environ['WORKFLOW_JOB'])
          sha = job.get('workflow_sha', '')
          expected = f'ClickHouse/clickhousectl/.github/workflows/provenance-runtime-probe.yml@{sha}'
          assert re.fullmatch('[0-9a-f]{40}', sha)
          assert job.get('workflow_repository') == 'ClickHouse/clickhousectl'
          assert job.get('workflow_ref') == expected
          print(json.dumps({'workflow_ref': job['workflow_ref'], 'workflow_sha': sha}))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'builder-sha={sha}\n')
          PY
      - name: Create an inert text fixture, not a product binary
        run: |
          printf 'Temporary provenance contract fixture\nsource=%s\nrun=%s/%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/provenance-runtime-probe.txt"
      - name: Upload raw fixture
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/provenance-runtime-probe.txt
          archive: false
          overwrite: false
          retention-days: 1
          if-no-files-found: error

  verify-platform:
    needs: fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download exact raw fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.fixture.outputs.artifact-id }}
          path: ${{ runner.temp }}/probe
          merge-multiple: true
          digest-mismatch: error
      - name: Check actual raw-artifact digest and run-source API shape
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.fixture.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.fixture.outputs.artifact-digest }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'probe'
          assert {p.name for p in directory.iterdir()} == {'provenance-runtime-probe.txt'}
          file = directory / 'provenance-runtime-probe.txt'
          digest = hashlib.sha256(file.read_bytes()).hexdigest()
          data = json.loads(subprocess.check_output(['gh', 'api', f"repos/ClickHouse/clickhousectl/actions/artifacts/{os.environ['ARTIFACT_ID']}"]))
          assert data['name'] == file.name
          assert data['id'] == int(os.environ['ARTIFACT_ID'])
          assert not data['expired']
          assert data['digest'].removeprefix('sha256:') == digest
          assert os.environ['ARTIFACT_DIGEST'].removeprefix('sha256:') == digest
          assert data['workflow_run']['id'] == int(os.environ['GITHUB_RUN_ID'])
          assert data['workflow_run']['head_sha'] == os.environ['GITHUB_SHA']
          print(json.dumps({'digest': data['digest'], 'run': data['workflow_run']}))
          PY
      - name: Attest only the inert fixture
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/probe/provenance-runtime-probe.txt
      - name: Download the checksum-pinned verifier without installing it
        run: |
          curl --fail --location --silent --show-error https://github.com/cli/cli/releases/download/v2.105.0/gh_2.105.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/gh.tar.gz"
          printf '%s  %s\n' 79e7ab5db738c48777b696e374f8b428f0647debfb424f44d2f426370407fe2f "$RUNNER_TEMP/gh.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/pinned-gh"
          tar --extract --gzip --file "$RUNNER_TEMP/gh.tar.gz" --directory "$RUNNER_TEMP/pinned-gh"
      - name: Verify the exact reusable identity and reject a different workflow
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDER_SHA: ${{ needs.fixture.outputs.builder-sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          builder = os.environ['BUILDER_SHA']
          identity = f'https://github.com/ClickHouse/clickhousectl/.github/workflows/provenance-runtime-probe.yml@{builder}'
          command = [str(root / 'pinned-gh/gh_2.105.0_linux_amd64/bin/gh'), 'attestation', 'verify', str(root / 'probe/provenance-runtime-probe.txt'), '--repo', 'ClickHouse/clickhousectl', '--cert-identity', identity, '--signer-digest', builder, '--source-digest', os.environ['GITHUB_SHA'], '--source-ref', os.environ['GITHUB_REF'], '--cert-oidc-issuer', 'https://token.actions.githubusercontent.com', '--predicate-type', 'https://slsa.dev/provenance/v1', '--deny-self-hosted-runners', '--format', 'json']
          result = json.loads(subprocess.check_output(command))
          assert result
          print(json.dumps(result))
          wrong = identity.replace('/provenance-runtime-probe.yml@', '/macos-build.yml@')
          command[command.index('--cert-identity') + 1] = wrong
          rejected = subprocess.run(command, capture_output=True, text=True)
          assert rejected.returncode == 1, rejected.stdout
          assert identity in rejected.stderr and wrong in rejected.stderr, rejected.stderr
          print('Different workflow identity rejected:', rejected.stderr.strip())
          PY
