name: Handoff diagnostic

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Diagnostic scenario
        required: true
        type: choice
        default: valid
        options:
          - valid
          - mismatched-attempt

permissions: {}

jobs:
  diagnostic:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare request
        run: python3 scripts/handoff-diagnostic.py request
      - name: Upload request
        id: request
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: handoff-request-${{ github.run_attempt }}
          path: ${{ runner.temp }}/handoff-request/request.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
      - name: Verify response
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_REPLY_APP_ID: ${{ vars.HANDOFF_REPLY_APP_ID }}
          ARTIFACT_ID: ${{ steps.request.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.request.outputs.artifact-digest }}
        run: python3 scripts/handoff-diagnostic.py verify
