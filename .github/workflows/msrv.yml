name: MSRV

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/msrv.yml"

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"

jobs:
  msrv:
    name: Check on declared rust-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Keep in sync with `rust-version` in the crate manifests.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: "1.89"

      # Library and binary targets only: test-only dev-dependencies (the AWS
      # SDK) need a newer compiler than the shipped crates do.
      - name: Check shipped crates
        run: |
          cargo check --locked -p clickhousectl -p clickhouse-cloud-api -p clickhouse-openapi-analyzer
          cargo check --locked -p clickhousectl --no-default-features
          cargo check --locked -p clickhouse-cloud-api --all-features
