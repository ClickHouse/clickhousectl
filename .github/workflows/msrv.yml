name: MSRV

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/msrv.yml"

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"

# A new push to a PR supersedes its earlier run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  msrv:
    name: Check on declared rust-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The MSRV is `workspace.package.rust-version`, which every crate
      # inherits; read it with the runner's preinstalled cargo.
      - name: Read declared rust-version
        id: msrv
        run: |
          versions=$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[].rust_version] | unique | .[]')
          if [ "$(printf '%s\n' "$versions" | wc -l)" -ne 1 ] || [ -z "$versions" ] || [ "$versions" = "null" ]; then
            echo "::error::expected one rust-version across the workspace, got: ${versions:-<none>}"
            exit 1
          fi
          echo "Declared rust-version: $versions"
          echo "version=$versions" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-10-16
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check all targets
        run: |
          cargo check --locked --workspace --all-targets
          cargo check --locked -p clickhousectl --all-targets --no-default-features
          cargo check --locked --workspace --all-targets --all-features
