name: Test CLI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/clickhousectl/**"
      # The CLI builds the API library by path.
      - "crates/clickhouse-cloud-api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/classify-install-integration.py"
      - "scripts/tests/test_classify_install_integration.py"
      - ".github/workflows/test-install.yml"
      - ".github/workflows/test-cli.yml"

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"

# A new push to a PR supersedes its earlier run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test clickhousectl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify install workflow path mapping
        run: python3 scripts/tests/test_classify_install_integration.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-10-16

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build -p clickhousectl

      - name: Clippy
        run: cargo clippy -p clickhousectl --all-targets -- -D warnings

      # Telemetry must compile out entirely for distro packagers.
      - name: Check without default features (telemetry compiled out)
        run: cargo check -p clickhousectl --no-default-features

      - name: Clippy without default features
        run: cargo clippy -p clickhousectl --all-targets --no-default-features -- -D warnings

      - name: Test
        run: cargo test -p clickhousectl
