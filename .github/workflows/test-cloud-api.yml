name: Test Cloud API Library

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/clickhouse-cloud-api/**"
      - "crates/clickhouse-openapi-analyzer/**"
      - "scripts/check-openapi-drift.py"
      - "scripts/check-release-versions.py"
      - "scripts/classify-cloud-integration.py"
      - "scripts/cloud-integration-decision.py"
      - "scripts/tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/clickhousectl/Cargo.toml"
      - "npm/package.json"
      - ".github/workflows/test-cloud-api.yml"
      - ".github/workflows/cloud-integration-decision.yml"

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"

# A new push to a PR supersedes its earlier run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test clickhouse-cloud-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test drift report rendering
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      # The release preflight runs the same check against the tag.
      - name: Check release versions agree
        run: python3 scripts/check-release-versions.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-10-16

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build -p clickhouse-cloud-api -p clickhouse-openapi-analyzer

      - name: Clippy
        run: cargo clippy -p clickhouse-cloud-api -p clickhouse-openapi-analyzer --all-targets -- -D warnings

      # `deprecated-fields` is off by default, so only this step lints it.
      - name: Clippy with every feature
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test -p clickhouse-cloud-api -p clickhouse-openapi-analyzer

      - name: Test with deprecated fields
        run: cargo test -p clickhouse-cloud-api --features deprecated-fields
